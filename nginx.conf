server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss: ws: https://fonts.googleapis.com https://fonts.gstatic.com; manifest-src 'self'; worker-src 'self' blob:; media-src 'self' blob:; frame-ancestors 'none'" always;

    # Health check endpoint for Coolify
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # Hub landing page at /
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Camera API backend
    location ^~ /camera-ws {
        resolver 127.0.0.11 valid=10s;
        set $upstream_camera_ws http://camera-api:3003;
        proxy_pass $upstream_camera_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Camera app frontend
    location ^~ /camera/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream_camera http://camera-app:80;
        proxy_pass $upstream_camera;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Planner API backend
    location ^~ /planner-api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream_planner_api http://planner-api:3005;
        rewrite ^/planner-api/(.*) /api/$1 break;
        proxy_pass $upstream_planner_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shopping API backend
    location ^~ /shopping-api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream_shopping_api http://shopping-api:3001;
        rewrite ^/shopping-api/(.*) /api/$1 break;
        proxy_pass $upstream_shopping_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Planner app frontend
    location ^~ /planner/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream_planner http://planner-app:80;
        proxy_pass $upstream_planner;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets (hub only)
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
